name: signalflow
version: "0.1.0"
config-version: 2
profile: signalflow

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "logs"]

models:
  signalflow:
    staging:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
      # Trino/Iceberg: CREATE OR REPLACE TABLE, so each rebuild is a new snapshot of the same table (history kept)
      +on_table_exists: replace

tests:
  signalflow:
    +store_failures: false
