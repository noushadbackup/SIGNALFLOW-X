name: ci

on:
  push:
    branches: [main]
  pull_request:

# Docker Compose interpolates every service, whatever profile is started, so each job that uses compose needs every
# required variable. These are throwaway values for CI containers, not secrets.
env:
  SIGNALFLOW_CDC_PASSWORD: ci-only-cdc-password
  SIGNALFLOW_S3_ACCESS_KEY: ci-only-access-key
  SIGNALFLOW_S3_SECRET_KEY: ci-only-secret-key
  AIRFLOW_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
  SUPERSET_SECRET_KEY: ci-only-superset-secret-key
  SUPERSET_ADMIN_PASSWORD: ci-only-admin-password

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: signalflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signalflow" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: signalflow
      PGPASSWORD: ci-only-password   # throwaway CI container credential, not a secret
      PGDATABASE: signalflow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest tests/unit -q
      - name: End-to-end acceptance tests (real PostgreSQL)
        run: pytest tests/integration -q -rA

  stream:
    # Phase 2 acceptance: Kafka + Kafka Connect/Debezium in containers, Spark in local mode on the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: signalflow
      PGPASSWORD: ci-only-password        # throwaway CI container credentials, not secrets
      PGDATABASE: signalflow
      KAFKA_PORT: "59092"
      CONNECT_PORT: "58083"
      SIGNALFLOW_KAFKA_BOOTSTRAP: 127.0.0.1:59092
      SIGNALFLOW_CONNECT_URL: http://127.0.0.1:58083
      SIGNALFLOW_REQUIRE_STREAM: "1"      # missing infrastructure fails the job instead of skipping tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,stream]"
      - uses: actions/cache@v4
        with:
          path: .cache/artifacts
          key: artifacts-${{ hashFiles('scripts/fetch_artifacts.sh') }}
      - name: Fetch pinned JVM artifacts (SHA-1 verified)
        run: scripts/fetch_artifacts.sh
      - name: Start Postgres, Kafka, Kafka Connect + Debezium
        run: docker compose --profile stream up -d --build --wait
      - name: Stream acceptance tests
        run: pytest tests/stream -q -rA
      - name: Spark job image builds
        run: docker compose --profile stream --profile stream-job build spark-silver
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile stream logs --tail 300

  lake:
    # Phase 3 acceptance: SeaweedFS + Trino in containers, Spark publisher and dbt-trino on the runner; then the
    # Airflow DAG runs end to end inside the Airflow image, and the Superset image builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: signalflow
      PGPASSWORD: ci-only-password        # throwaway CI container credentials, not secrets
      PGDATABASE: signalflow
      SIGNALFLOW_S3_ENDPOINT: http://127.0.0.1:58333
      SIGNALFLOW_LAKE_SOURCE_DB: signalflow
      SIGNALFLOW_REQUIRE_LAKE: "1"        # missing infrastructure fails the job instead of skipping tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,lake]"
      - uses: actions/cache@v4
        with:
          path: .cache/artifacts
          key: artifacts-${{ hashFiles('scripts/fetch_artifacts.sh') }}
      - name: Fetch pinned JVM artifacts (SHA-1 verified)
        run: scripts/fetch_artifacts.sh
      - name: Start Postgres, SeaweedFS, Trino
        run: docker compose --profile lake up -d --wait
      - name: Lake acceptance tests
        run: pytest tests/lake -q -rA
      - name: Airflow DAG end to end (lite pipeline, then the DAG inside the Airflow image)
        run: |
          signalflow generate --out data/seed7 --seed 7
          signalflow run --data data/seed7
          docker compose --profile lake --profile airflow build airflow-init
          docker compose --profile lake --profile airflow run --rm airflow-init
          docker compose --profile lake --profile airflow run --rm --no-deps airflow-scheduler \
            bash -c "airflow dags reserialize && airflow dags test signalflow_lakehouse"
          signalflow lake compare --database signalflow
      - name: Superset image builds
        run: docker compose --profile superset build superset
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile lake --profile airflow logs --tail 300
