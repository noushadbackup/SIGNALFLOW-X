[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow-x"
version = "0.1.0"
description = "SignalFlow X: simulated telecom + manufacturing data platform (portfolio project)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema==4.26.0",
  "psycopg[binary]==3.2.13",
  "dbt-core==1.11.16",
  "dbt-postgres==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.0", "mypy==1.18.2"]
ui = ["streamlit==1.50.0", "plotly==6.3.0"]
stream = ["pyspark==4.0.3", "confluent-kafka==2.12.0", "pandas==2.3.3", "pyarrow==21.0.0"]
lake = ["pyspark==4.0.3", "trino==0.340.0", "dbt-trino==1.10.6", "requests==2.34.2"]

[project.scripts]
signalflow = "signalflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL server reachable through PG* environment variables",
  "stream: needs the stream compose profile (Kafka, Kafka Connect), Java 17+ and the Spark jars",
  "lake: needs the lake compose profile (SeaweedFS, Trino), Java 17+ and the lake jars",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# inline CSS, HTML templates and Plotly hover templates read better unwrapped
"src/signalflow/ui/app.py" = ["E501"]
"src/signalflow/ui/components.py" = ["E501"]
"src/signalflow/ui/leak_hunter.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
