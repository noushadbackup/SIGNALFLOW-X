# Iceberg tables in the S3-compatible store, catalog metadata in Postgres (JDBC catalog, ADR-0009).
# Secrets are read from the container environment by Trino's ${ENV:...} substitution, never written here.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/${ENV:SIGNALFLOW_CATALOG_DB}
iceberg.jdbc-catalog.connection-user=${ENV:PGUSER}
iceberg.jdbc-catalog.connection-password=${ENV:PGPASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://${ENV:SIGNALFLOW_LAKE_BUCKET}/warehouse
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:SIGNALFLOW_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:SIGNALFLOW_S3_SECRET_KEY}
