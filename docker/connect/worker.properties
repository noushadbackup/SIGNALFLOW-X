# Kafka Connect distributed worker (single node for local use).
bootstrap.servers=kafka:9092
group.id=signalflow-connect
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
plugin.path=/opt/connect/plugins

config.storage.topic=_connect_configs
offset.storage.topic=_connect_offsets
status.storage.topic=_connect_status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# Connector configs reference secrets as ${env:NAME}; values are resolved inside the worker from its environment,
# so passwords never travel through the REST API or land in the _connect_configs topic.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
offset.flush.interval.ms=5000
