# SignalFlow X — local deployment.
# Profiles: `lite` (Postgres only, Phase 1) and `stream` (adds Kafka, Kafka Connect + Debezium, Spark; Phase 2).
# The `full` profile (lakehouse, orchestration, BI) is added in Phase 3 as its services are verified.
# Images default to mirror.gcr.io because Docker Hub rate-limits anonymous pulls; override with *_IMAGE variables.
name: signalflow

services:
  postgres:
    profiles: ["lite", "stream", "full"]
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:16-alpine}
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=16", "-c", "max_wal_senders=16",
              "-c", "shared_buffers=256MB", "-c", "work_mem=32MB"]
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"   # loopback only by default
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  kafka:
    profiles: ["stream", "full"]
    image: ${KAFKA_IMAGE:-mirror.gcr.io/apache/kafka:4.1.1}
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-sfx-local-kraft-cluster1}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly from the contract registry
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # single broker: no replication (documented limitation)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-59092}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  connect:
    profiles: ["stream", "full"]
    build:
      context: .
      dockerfile: docker/connect/Dockerfile
    image: signalflow/connect:4.1.1-debezium-3.6.3
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      CDC_PASSWORD: ${SIGNALFLOW_CDC_PASSWORD:?set SIGNALFLOW_CDC_PASSWORD in .env}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${CONNECT_PORT:-58083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/connector-plugins | grep -q PostgresConnector"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  spark-silver:
    # Streaming Bronze/Silver job. Runs Spark in local mode inside the container; host-mode alternative:
    # `signalflow stream silver` with Java 17+ installed (that is what the test suite does).
    profiles: ["stream-job"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: signalflow/spark-silver:4.0.3
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      SIGNALFLOW_STREAM_DB: ${SIGNALFLOW_STREAM_DB:-signalflow_stream}
      SIGNALFLOW_KAFKA_BOOTSTRAP: kafka:9092
      SIGNALFLOW_STATE_DIR: /state
    volumes:
      - sparkstate:/state
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  sparkstate:
